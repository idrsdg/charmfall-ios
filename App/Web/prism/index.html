<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Prism Pop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath d=%2732 4 60 32 32 60 4 32z%27 fill=%27%234d8dff%27/%3E%3Cpath d=%2732 4 60 32 32 32z%27 fill=%27%23a9ccff%27/%3E%3C/svg%3E">
<meta name="description" content="Match three gems, make specials, clear jelly, bring down keys. One hundred levels, daily rewards, boosters and a frenzy meter.">
<meta name="theme-color" content="#041a1c">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #041a1c; overscroll-behavior: none; }
  body { font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; user-select: none; }
  [hidden] { display: none !important; }
  .screen { position: fixed; inset: 0; }
  .bg { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% -10%, #0f6b63 0%, #0a3d3f 40%, #041a1c 100%); overflow: hidden; }
  .bg::before, .bg::after { content: ""; position: absolute; width: 140vmax; height: 140vmax; left: -20vmax; top: -40vmax; border-radius: 50%; will-change: transform; }
  .bg::before { background: radial-gradient(circle at 30% 40%, rgba(255, 190, 90, .32) 0%, rgba(255, 190, 90, 0) 32%), radial-gradient(circle at 70% 60%, rgba(40, 220, 170, .32) 0%, rgba(40, 220, 170, 0) 30%); animation: drift 26s ease-in-out infinite alternate; }
  .bg::after { background: radial-gradient(circle at 60% 30%, rgba(255, 196, 0, .35) 0%, rgba(255, 196, 0, 0) 26%), radial-gradient(circle at 25% 75%, rgba(20, 150, 140, .45) 0%, rgba(20, 150, 140, 0) 34%); animation: drift 34s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translate(-6%, -4%) rotate(0deg) scale(1); } to { transform: translate(8%, 10%) rotate(40deg) scale(1.15); } }
  /* while a level is on screen the decorative background stands still: nothing but the game animates */
  body:has(#game:not([hidden])) .bg::before, body:has(#game:not([hidden])) .bg::after, body:has(#game:not([hidden])) .bg i, body:has(#game:not([hidden])) .bg svg { animation-play-state: paused; }
  .bg svg { position: absolute; top: -12vh; opacity: .2; animation: charmfall linear infinite; will-change: transform; }
  @keyframes charmfall { from { transform: translateY(0) rotate(var(--r0)); } to { transform: translateY(128vh) rotate(var(--r1)); } }
  .bg i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; animation: tw 2.4s infinite alternate; }
  @keyframes tw { from { opacity: .25; transform: scale(.7); } to { opacity: 1; transform: scale(1.3); } }

  /* ---------- map ---------- */
  #map { overflow-y: auto; overflow-x: hidden; padding: 0 0 60px; }
  .top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: max(14px, env(safe-area-inset-top)) 18px 10px; background: linear-gradient(#041a1c 40%, rgba(4, 26, 28, 0)); }
  .logo { font-size: 28px; font-weight: 900; letter-spacing: -.03em; text-shadow: 0 3px 0 #06403c, 0 8px 24px rgba(0, 0, 0, .5); }
  .logo span { color: #7df0d0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(#12635c, #0a3a38); border: 2px solid #ff7a4d; border-radius: 999px; padding: 6px 12px; font-size: 15px; font-weight: 900; box-shadow: 0 3px 0 #04201f; }
  .pill + .pill { border-color: #ffd200; box-shadow: 0 3px 0 #04201f; }
  .path { position: relative; width: min(420px, 100%); margin: 10px auto 0; }
  .path svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .35); background: radial-gradient(circle at 35% 30%, #ffd0bd, #ff7a4d 55%, #a8351a); box-shadow: 0 7px 0 #7a2410, 0 14px 28px rgba(0, 0, 0, .5), inset 0 -4px 0 rgba(0, 0, 0, .15); cursor: pointer; transition: translate .14s cubic-bezier(.3, 1.5, .5, 1); animation: nodeIn .5s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: var(--d, 0s); }
  @keyframes nodeIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .node { border: 3px solid #ffe08a; }
  .node:active { translate: 0 4px; }
  .node.fz:not(.locked)::before { content: "⏱"; position: absolute; top: -8px; left: -8px; width: 22px; height: 22px; border-radius: 50%; background: #06282a; border: 2px solid #fff; font-size: 12px; line-height: 21px; text-align: center; text-shadow: none; }
  .node.locked { background: radial-gradient(circle at 35% 30%, #9cc4bc, #4f8880 55%, #0e4f4a); box-shadow: 0 7px 0 #0d2a28, 0 10px 20px rgba(0, 0, 0, .4); border: 3px solid rgba(255, 255, 255, .35); cursor: default; }
  .node.locked::before { content: "🔒"; position: absolute; top: -10px; right: -8px; font-size: 18px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .6)); }
  .node.done { background: radial-gradient(circle at 35% 30%, #a8ffd6, #19e07f 55%, #0a8a4a); box-shadow: 0 7px 0 #06603a, 0 14px 28px rgba(0, 0, 0, .5); }
  .node.current { animation: nodeIn .5s cubic-bezier(.2, 1.4, .4, 1) both, pulse 1.2s .5s infinite; }
  .node.current::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px solid #ffd200; animation: halo 1.2s infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  @keyframes halo { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
  .node .stars { position: absolute; bottom: -16px; font-size: 15px; letter-spacing: -2px; color: #ffd200; text-shadow: 0 2px 0 #7a4a00; }

  /* ---------- game ---------- */
  #game { display: flex; flex-direction: column; }
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: max(12px, env(safe-area-inset-top)) 14px 8px; }
  .hud .box { flex: 0 1 auto; background: rgba(3, 22, 24, .7); border: 2px solid rgba(255, 255, 255, .28); border-radius: 16px; padding: 6px 12px; text-align: center; min-width: 78px; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
  .hud .box { border-color: #ffd76a; background: linear-gradient(#0e4f4a, #052625); box-shadow: 0 4px 0 #7a4a00, inset 0 2px 0 rgba(255, 255, 255, .25); }
  .hud .box small { display: block; font-size: 11px; font-weight: 900; color: #7df0d0; text-transform: uppercase; letter-spacing: .08em; }
  .hud .box b { display: inline-block; font-size: clamp(17px, 5vw, 23px); font-weight: 900; line-height: 1.1; text-shadow: 0 2px 0 rgba(0, 0, 0, .5); font-variant-numeric: tabular-nums; }
  .hud .box.score small { color: #ffd200; }
  .hud .goal { display: flex; gap: 10px; align-items: center; border-color: #ff7a4d; }
  .hud .goal small { color: #ffb199; }
  .hud .goal b { font-size: clamp(15px, 4.4vw, 19px); }
  .bump { animation: bump .35s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); color: #ffd200; } 100% { transform: scale(1); } }
  @media (max-width: 560px) { .hud { padding-left: 8px; padding-right: 8px; gap: 5px; } .hud .box { min-width: 0; padding: 5px 8px; } .back { padding: 8px 10px; } .back .lbl { display: none; } .hud .goal { gap: 6px; } .hud .goal span { font-size: 18px !important; } }
  .bar { height: 12px; margin: 0 14px; border-radius: 999px; background: rgba(0, 0, 0, .6); overflow: hidden; position: relative; border: 2px solid rgba(255, 255, 255, .25); }
  .bar i { position: absolute; inset: 0; background: linear-gradient(90deg, #7df0d0, #2fd6a8, #ff7a4d, #ffd200); transform: translateX(-100%); transition: transform .6s cubic-bezier(.2, .8, .2, 1); border-radius: 999px; will-change: transform; }
  .bar s { position: absolute; top: -3px; width: 3px; height: 16px; background: #ffd200; transition: background .25s, scale .35s cubic-bezier(.3, 1.8, .5, 1); }
  .bar s.hit { background: #fff; scale: 1.6 1; }
  #boardWrap { flex: 1; display: grid; place-items: center; padding: 8px; min-height: 0; }
  #c { display: block; touch-action: none; border-radius: 16px; background: #020f0f; box-shadow: 0 0 0 2px #fff0b0, 0 0 0 8px #e0a92e, 0 0 0 10px #7a4a00, 0 24px 50px rgba(0, 0, 0, .6); outline: 3px dotted #fff6d0; outline-offset: 2.5px; }
  .boosters { display: flex; justify-content: center; gap: 10px; padding: 8px 0 max(14px, env(safe-area-inset-bottom)); }
  .boost { position: relative; width: 60px; height: 60px; border-radius: 18px; border: 2.5px solid rgba(255, 255, 255, .4); background: linear-gradient(#12635c, #0a3a38); display: grid; place-items: center; font-size: 28px; cursor: pointer; box-shadow: 0 5px 0 #04201f, 0 10px 20px rgba(0, 0, 0, .4); transition: translate .12s cubic-bezier(.3, 1.5, .5, 1), box-shadow .12s, opacity .25s, filter .25s; }
  .boost { width: 64px; height: 64px; border: 3px solid #ffd76a; background: radial-gradient(circle at 50% 28%, #2aa392, #0a3d3a 72%); box-shadow: 0 5px 0 #8a5200, 0 10px 20px rgba(0, 0, 0, .45), inset 0 2px 0 rgba(255, 255, 255, .45), inset 0 -8px 12px rgba(0, 0, 0, .35); }
  .boost[data-b="hammer"] { background: radial-gradient(circle at 50% 28%, #3f6bff, #0c1a70 72%); }
  .boost[data-b="moves"] { background: radial-gradient(circle at 50% 28%, #17a85a, #05401f 72%); }
  .boost[data-b="switch"] { background: radial-gradient(circle at 50% 28%, #a22be0, #3a0a60 72%); }
  .boost[data-b="cross"] { background: radial-gradient(circle at 50% 28%, #12a0c4, #043a52 72%); }
  .boost[data-b="undo"] { background: radial-gradient(circle at 50% 28%, #d87a00, #5e2a00 72%); }
  .boost:active { box-shadow: 0 2px 0 #8a5200, inset 0 2px 0 rgba(255, 255, 255, .45); }
  .boost svg { width: 46px; height: 46px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }
  .boost:active { translate: 0 3px; box-shadow: 0 2px 0 #04201f; }
  .boost.on { border-color: #ffd200; background: linear-gradient(#ffb300, #ff7a00); box-shadow: 0 5px 0 #8a3d00; animation: pulse .8s infinite; }
  .boost.empty { opacity: .45; filter: saturate(.3); }
  .boost u { position: absolute; top: -9px; right: -9px; width: 24px; height: 24px; border-radius: 50%; background: #ff2d55; border: 2px solid #fff; font: 900 12px/20px sans-serif; text-align: center; text-decoration: none; box-shadow: 0 2px 6px rgba(0, 0, 0, .5); }
  .back { border: 0; white-space: nowrap; font: inherit; font-weight: 900; color: #05302a; background: linear-gradient(#c4ffec, #2fd6a8); border: 2px solid #fff; padding: 8px 12px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #0a7a5c; transition: translate .1s cubic-bezier(.3, 1.5, .5, 1), box-shadow .1s; }
  .back:active { translate: 0 2px; box-shadow: 0 2px 0 #0a7a5c; }
  .back.pause { background: linear-gradient(#ffc2ad, #ff7a4d); color: #fff; box-shadow: 0 4px 0 #8a2c14; font-size: 18px; line-height: 1; padding: 7px 11px; }
  .back.pause:active { box-shadow: 0 2px 0 #8a2c14; }
  .back.snd { background: linear-gradient(#a6ffbe, #22e65a); color: #053d1c; box-shadow: 0 4px 0 #047a2c; font-size: 16px; line-height: 1; padding: 8px 10px; }
  .back.snd:active { box-shadow: 0 2px 0 #047a2c; }

  /* ---------- overlays ---------- */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(2, 14, 16, .8); z-index: 10; padding: 16px; animation: fade .25s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .card { width: min(360px, 100%); background: linear-gradient(160deg, #136058, #082f2e 70%); border: 3px solid rgba(255, 255, 255, .3); border-radius: 26px; padding: 26px 24px; text-align: center; box-shadow: 0 30px 80px rgba(0, 0, 0, .7); animation: cardIn .45s cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes cardIn { from { transform: scale(.6) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h2 { margin: 0 0 6px; font-size: 28px; font-weight: 900; letter-spacing: -.02em; text-shadow: 0 3px 0 #06403c; }
  .card p { margin: 0 0 14px; font-size: 16px; font-weight: 700; }
  .card .big { font-size: 50px; margin: 6px 0 10px; letter-spacing: -2px; }
  .card .big b { color: #ffd200; text-shadow: 0 3px 0 #9a5b00; }
  .card .big b i { display: inline-block; font-style: normal; animation: starIn .6s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: var(--d, 0s); }
  @keyframes starIn { from { transform: scale(0) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .card .big s { color: rgba(255, 255, 255, .3); text-decoration: none; }
  .btn { border: 0; font: inherit; font-size: 18px; font-weight: 900; color: #2a1200; background: linear-gradient(#ffe259, #ffa700); padding: 14px 24px; border-radius: 999px; cursor: pointer; box-shadow: 0 5px 0 #a85d00, 0 10px 20px rgba(0, 0, 0, .4); margin: 4px; transition: translate .12s cubic-bezier(.3, 1.5, .5, 1), box-shadow .12s; }
  .btn:active { translate: 0 3px; box-shadow: 0 2px 0 #a85d00; }
  .btn.ghost { background: linear-gradient(#1f8a7e, #12635c); color: #fff; box-shadow: 0 5px 0 #062a28, 0 10px 20px rgba(0, 0, 0, .4); }
  /* ---------- mobile app only (html.app is set by the iOS wrapper): one rule for every pop-up.
     Buttons are the same height, full width, stacked with one gap; a pair of secondary actions shares a row; every button keeps the same ledge shadow in its own tone. */
  html.app .btn { line-height: 1.2; text-decoration: none !important; }
  /* pop-up buttons in the app are flat: no ledge under any of them, one thin inner rim on all, one pressed look */
  html.app .card .btn { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .26); border: 0 !important; }
  html.app .card .btn:active { translate: 0 1px; filter: brightness(.9); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .26); }
  html.app .btn[data-arcade-share] { background: #0b0b12 !important; color: #fff !important; }
  html.app .modal { padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  html.app .card { padding: 26px 24px 26px; max-height: calc(100dvh - 32px); overflow-y: auto; }
  html.app .card .btn { display: flex !important; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box; width: 100%; min-height: 52px; margin: 12px 0 0; padding: 12px 16px; white-space: nowrap; }
  html.app .card .btn[hidden], html.app .card a[href="../games/"] { display: none !important; }
  html.app .card p + .btn, html.app .card .goalrow + .btn, html.app .card .days + .btn { margin-top: 2px; }
  html.app #eBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  html.app #mEnd [data-arcade-roast] { margin: 0; }
  html.app #eBtns .btn { margin: 0; }
  html.app #eBtns .btn:first-child, html.app #eBtns .btn:last-child:nth-child(even) { grid-column: 1 / -1; }
  /* game screen in the app: pause alone top-left with the two progress bars beside it, then three equal metric boxes, then the board */
  html.app #game { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: auto auto auto 1fr auto; column-gap: 10px; padding: max(12px, env(safe-area-inset-top)) 14px 0; }
  html.app .hud { display: contents; }
  html.app #btnBack, html.app #btnSound, html.app .top .snd, html.app .top a[href="../games/"], html.app #mPause .snd, html.app #mPause [data-arcade-vol] { display: none !important; }
  html.app #btnPause { grid-column: 1; grid-row: 1 / span 2; justify-self: start; align-self: center; width: 46px; height: 46px; padding: 0; font-size: 18px; }
  html.app .bar { grid-column: 2 / -1; grid-row: 1; margin: 0; align-self: end; }
  html.app .frz { grid-column: 2 / -1; grid-row: 2; margin: 9px 0 0; align-self: start; }
  html.app .hud .box { grid-row: 3; grid-column: span 2; min-width: 0; margin-top: 14px; padding: 7px 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  html.app .hud .box b { font-size: 21px; white-space: nowrap; }
  html.app .hud .goal { flex-direction: row; gap: 7px; }
  html.app .hud .goal b { font-size: 19px; }
  html.app #boardWrap { grid-column: 1 / -1; grid-row: 4; min-height: 0; padding: 14px 0 6px; margin: 0 -14px; }
  html.app .boosters { grid-column: 1 / -1; grid-row: 5; }
  /* map in the app: the sound switch sits under the top bar */
  .mapset { display: none; }
  html.app .mapset { display: flex; flex-direction: column; gap: 10px; position: fixed; right: 12px; top: calc(max(14px, env(safe-area-inset-top)) + 54px); z-index: 2; }
  html.app .mapset button { width: 46px; height: 46px; padding: 0; justify-content: center; font: inherit; font-size: 20px; color: #fff; border-color: #ffd76a; cursor: pointer; }
  html.app .mapset button.off { border-color: rgba(255, 255, 255, .35); background: linear-gradient(#2a2440, #17132a); }
  html.app .mapset button.off span { opacity: .45; }
  .goalrow { display: flex; justify-content: center; gap: 12px; margin: 10px 0 18px; font-weight: 900; font-size: 18px; }
  .goalrow div { background: rgba(0, 0, 0, .4); border: 2px solid rgba(255, 255, 255, .2); border-radius: 14px; padding: 10px 14px; }
  .goalrow div small { display: block; font-size: 11px; color: #7df0d0; text-transform: uppercase; letter-spacing: .06em; }
  .toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.4); font-size: clamp(40px, 9vw, 68px); font-weight: 900; letter-spacing: -.03em; color: #fff; -webkit-text-stroke: 2px #06403c; paint-order: stroke fill; text-shadow: 0 6px 0 #06403c, 0 14px 40px rgba(0, 0, 0, .7); pointer-events: none; opacity: 0; z-index: 9; white-space: nowrap; }
  @keyframes toastIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(2deg); } 30% { transform: translate(-50%, -50%) scale(1) rotate(0); } 75% { opacity: 1; transform: translate(-50%, -52%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1.1); } }
  .fly { position: fixed; z-index: 8; font-size: 30px; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5)); }
  /* ---------- motion + new features ---------- */
  #game:not([hidden]) .hud, #game:not([hidden]) .bar, #game:not([hidden]) .frz { animation: dropIn .45s cubic-bezier(.2, .9, .3, 1) both; }
  #game:not([hidden]) .boosters { animation: riseIn .5s .08s cubic-bezier(.2, .9, .3, 1) both; }
  #game:not([hidden]) #c { animation: boardIn .5s cubic-bezier(.2, 1.1, .3, 1) both; }
  @keyframes dropIn { from { transform: translateY(-26px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes riseIn { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes boardIn { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal.out { animation: fadeOut .17s both; pointer-events: none; }
  .modal.out .card { animation: cardOut .17s cubic-bezier(.4, 0, 1, 1) both; }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes cardOut { to { transform: scale(.9) translateY(14px); opacity: 0; } }
  .frz { display: flex; align-items: center; gap: 6px; margin: 6px 14px 0; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .08em; color: #ffd200; }
  .frz span { display: inline-block; font-size: 13px; }
  .fbar { flex: 1; height: 9px; border-radius: 999px; background: rgba(0, 0, 0, .6); border: 2px solid rgba(255, 255, 255, .25); overflow: hidden; position: relative; }
  .fbar i { position: absolute; inset: 0; background: linear-gradient(90deg, #ff5a00, #ffd200); transform: translateX(-100%); transition: transform .45s cubic-bezier(.2, .8, .2, 1); border-radius: 999px; will-change: transform; }
  .frz.full span { animation: pulse .5s infinite; }
  .frz.full .fbar { border-color: #fff; }
  .mapbar { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 10px; z-index: 3; pointer-events: none; animation: riseIn .5s .15s cubic-bezier(.2, .9, .3, 1) both; }
  .mapbar button { pointer-events: auto; position: relative; border: 2px solid #fff; font: inherit; font-size: 15px; font-weight: 900; color: #fff; background: linear-gradient(#1f8a7e, #0c4743); padding: 10px 16px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 0 #04201f; transition: translate .12s cubic-bezier(.3, 1.5, .5, 1), box-shadow .12s; }
  .mapbar button:active { translate: 0 3px; box-shadow: 0 1px 0 #04201f; }
  .mapbar button.ready { background: linear-gradient(#ffe259, #ffa700); color: #2a1200; box-shadow: 0 4px 0 #a85d00; animation: pulse 1.1s infinite; }
  .mapbar button.ready::after { content: ""; position: absolute; top: -5px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: #ff2d55; border: 2px solid #fff; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 12px 0 14px; }
  .days div { background: rgba(0, 0, 0, .4); border: 2px solid rgba(255, 255, 255, .2); border-radius: 10px; padding: 6px 0 5px; font-weight: 900; min-width: 0; }
  .days small { display: block; font-size: 9px; color: #7df0d0; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
